name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run all

      # Commit dist/ to the release tag
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "build: add dist for ${{ github.event.release.tag_name }}"
          git tag -f ${{ github.event.release.tag_name }}
          git push -f origin ${{ github.event.release.tag_name }}

      # Update major version tag (v1, v2, etc.)
      - run: |
          MAJOR=$(echo "${{ github.event.release.tag_name }}" | grep -oP '^v\d+')
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
